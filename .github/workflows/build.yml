
name: Online Build (Extra Options)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: MSBuild vorbereiten
      uses: microsoft/setup-msbuild@v2

    - name: NuGet-Pakete wiederherstellen
      run: |
        nuget restore OpenCVC.sln

    - name: Projekt kompilieren (64-Bit)
      run: |
        msbuild OpenCVC.sln /p:Configuration=Release /p:Platform=x64

    - name: Fertige Dateien speichern
      uses: actions/upload-artifact@v4
      with:
        name: OpenCV-C-Release
        path: D:/a/OpenCV-C/OpenCV-C/x64/Release
